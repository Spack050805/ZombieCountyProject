; Cook only the gameplay map + main menu map, plus their referenced assets. Without
; MapsToCook, UE bakes the entire /Game/ folder (>9000 shaders) which triggers
; ShaderCompileWorker access violations. Dependency cook handles inclusion — every
; texture/mesh/material reached from these maps via BP/material refs gets baked.
+MapsToCook=(FilePath="/Game/SoStylized/Maps/TreesFir/40x40_areaMenu")
+MapsToCook=(FilePath="/Game/SoStylized/Maps/TreesFir/40x40_area")
; CC_Shaders/StandardShader (RL_Standard parent material) and SkinShader are needed —
; the Z1/Z2/Z3 zombie materials inherit from RL_Standard. Block only Utilities/, where
; the broken CR_FaceExpRig Control Rig lives (RigVM struct missing on this engine,
; serializes with FallbackStruct and fails the cook).
+DirectoriesToNeverCook=(Path="/Game/CC_Shaders/Utilities")
